name: Rebuild catalog

on:
  schedule:
    - cron: "0 6 1 * *" # day 1 of each month, 03:00 in Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Rebuild from the stores and the CMED list
        run: |
          printf '%s\n' "$STORE_DATABASE_URLS" > .env
          python catalog.py --refresh-cmed
        env:
          STORE_DATABASE_URLS: ${{ secrets.STORE_DATABASE_URLS }}

      - name: Save the catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogo.csv
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Update medicine catalog"
            git pull --rebase
            git push
          fi
